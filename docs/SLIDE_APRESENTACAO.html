<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polo Feedback — Apresentação</title>
  <style>
    :root {
      --bg: #0b0f12;
      --panel: #101820;
      --panel-2: #121d26;
      --lime: #a3e635;
      --lime-soft: #d9f99d;
      --white: #f8fafc;
      --muted: #cbd5e1;
      --gray: #64748b;
      --green: #22c55e;
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0b0f12 0%, #111827 40%, #0f172a 100%);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
    }

    .slide {
      width: min(1100px, 100%);
      background: linear-gradient(180deg, rgba(16,24,32,0.96), rgba(18,29,38,0.96));
      border: 1px solid rgba(163, 230, 53, 0.25);
      border-radius: 24px;
      box-shadow: 0 25px 60px var(--shadow);
      padding: 48px 56px;
      position: relative;
      overflow: hidden;
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, var(--lime), #4ade80, #22c55e);
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(163, 230, 53, 0.12);
      border: 1px solid rgba(163, 230, 53, 0.3);
      color: var(--lime-soft);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(2.3rem, 4vw, 4rem);
      margin: 18px 0 14px;
      line-height: 1.1;
    }

    h2 {
      font-size: clamp(1.8rem, 2.5vw, 2.8rem);
      margin-bottom: 18px;
    }

    p, li {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px;
      margin-top: 26px;
    }

    .card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 18px;
      padding: 20px 22px;
    }

    .card strong {
      color: var(--white);
      display: block;
      margin-bottom: 8px;
      font-size: 1.07rem;
    }

    ul {
      margin: 10px 0 0 20px;
      padding: 0;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .metric {
      background: rgba(163, 230, 53, 0.05);
      border: 1px solid rgba(163, 230, 53, 0.2);
      border-radius: 18px;
      padding: 18px 14px;
      text-align: center;
    }

    .metric .value {
      font-size: 2rem;
      font-weight: bold;
      color: var(--lime-soft);
      margin-bottom: 6px;
    }

    .footer {
      margin-top: 30px;
      color: var(--gray);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 760px) {
      .slide { padding: 28px 24px; }
      .grid, .metrics { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="slide">
    <div class="tag">Polo Feedback</div>
    <h1>Sistema de feedback inteligente para a academia</h1>
    <p>Uma solução para ouvir os alunos, entender a operação e agir com rapidez.</p>

    <div class="metrics">
      <div class="metric">
        <div class="value">⚡</div>
        <div>Feedback rápido</div>
      </div>
      <div class="metric">
        <div class="value">📊</div>
        <div>Dashboard gerencial</div>
      </div>
      <div class="metric">
        <div class="value">🤖</div>
        <div>IA e chatbot</div>
      </div>
      <div class="metric">
        <div class="value">📱</div>
        <div>QR Code</div>
      </div>
    </div>

    <div class="footer">Polo Fit • Gestão de experiência do cliente</div>
  </section>
</body>
</html>
