{% load static %}
<link rel="manifest" href="{% static 'feedback/manifest.webmanifest' %}">
<meta name="theme-color" content="#0b0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Polo Feedback">
<link rel="apple-touch-icon" href="{% static 'feedback/pwa-192.png' %}">
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("{% url 'service_worker' %}")
                .catch(function (error) { console.error("Falha ao ativar suporte offline:", error); });
        });
    }
</script>
