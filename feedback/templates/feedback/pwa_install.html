{% load static %}
<style>
    #pwa-install-area[hidden] {
        display: none;
    }

    #pwa-install-area {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 1000;
        font-family: Inter, Arial, sans-serif;
    }

    #pwa-install-button {
        min-height: 48px;
        border: 0;
        border-radius: 0.875rem;
        padding: 0.75rem 1rem;
        background: #a3e635;
        color: #0f172a;
        font: 700 0.875rem/1.25 Inter, Arial, sans-serif;
        box-shadow: 0 12px 30px rgb(0 0 0 / 30%);
        cursor: pointer;
    }

    #pwa-install-button:hover {
        background: #bef264;
    }

    #pwa-install-button:focus-visible,
    #pwa-install-close:focus-visible {
        outline: 3px solid #65a30d;
        outline-offset: 3px;
    }

    #pwa-install-help {
        width: min(26rem, calc(100vw - 2rem));
        max-width: none;
        max-height: calc(100vh - 2rem);
        max-height: calc(100dvh - 2rem);
        overflow: auto;
        margin: auto;
        border: 1px solid #e2e8f0;
        border-radius: 1.5rem;
        padding: 0;
        background: #fff;
        color: #0f172a;
        font: 400 1rem/1.5 Inter, Arial, sans-serif;
        box-shadow: 0 24px 64px rgb(2 6 23 / 35%);
    }

    #pwa-install-help::backdrop {
        background: rgb(2 6 23 / 70%);
    }

    .pwa-install-content {
        padding: 1.5rem;
    }

    .pwa-install-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
    }

    .pwa-install-brand {
        margin: 0;
        color: #15803d;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .pwa-install-title {
        margin: 0.5rem 0 0;
        font-size: 1.5rem;
        font-weight: 900;
        line-height: 1.2;
    }

    #pwa-install-close {
        flex: 0 0 auto;
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 0.75rem;
        background: transparent;
        color: #64748b;
        font: inherit;
        font-size: 1.5rem;
        cursor: pointer;
    }

    #pwa-install-close:hover {
        background: #f1f5f9;
    }

    #pwa-install-instructions {
        margin: 1rem 0 0;
        color: #334155;
        font-size: 1rem;
        line-height: 1.6;
    }

    .pwa-install-note {
        margin: 0.75rem 0 0;
        color: #64748b;
        font-size: 0.875rem;
        line-height: 1.6;
    }

    @media (max-width: 480px) {
        #pwa-install-area {
            right: 0.75rem;
            bottom: 0.75rem;
        }

        .pwa-install-content {
            padding: 1.25rem;
        }
    }
</style>

<div id="pwa-install-area" hidden>
    <button id="pwa-install-button" type="button">
        Instalar no celular
    </button>
</div>

<dialog id="pwa-install-help" aria-labelledby="pwa-install-title">
    <div class="pwa-install-content">
        <div class="pwa-install-heading">
            <div>
                <p class="pwa-install-brand">Polo Feedback</p>
                <h2 class="pwa-install-title" id="pwa-install-title">Instalar no celular</h2>
            </div>
            <button id="pwa-install-close" type="button" aria-label="Fechar instruções">&times;</button>
        </div>
        <p id="pwa-install-instructions"></p>
        <p class="pwa-install-note">
            O Polo Feedback é instalado como aplicativo web (PWA). Ainda não há uma versão publicada na Google Play Store.
        </p>
    </div>
</dialog>

<script src="{% static 'feedback/pwa-install.js' %}?v=2" defer></script>
