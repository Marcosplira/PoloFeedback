databases:
  - name: polofeedback-db
    databaseName: polofeedback
    user: polo
    plan: 0.1c-256mb

services:
  - type: web
    name: polofeedback
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # --workers 2: adequado para o plano free do Render (512 MB RAM)
    # --timeout 60: evita que requests lentos (ex: Gemini) causem erro 502
    startCommand: gunicorn polofeedback.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --log-level info
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: polofeedback-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "polofeedback.onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://polofeedback.onrender.com"
      # GEMINI_API_KEY: configure manualmente no painel do Render em "Environment"
      # para não expor a chave no repositório.
      # - key: GEMINI_API_KEY
      #   value: "SUA_CHAVE_AQUI"
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      # DJANGO_ADMIN_PASSWORD: configure manualmente no painel do Render
      # para definir a senha do usuário admin em produção.
      # - key: DJANGO_ADMIN_PASSWORD
      #   value: "SUA_SENHA_SEGURA_AQUI"
