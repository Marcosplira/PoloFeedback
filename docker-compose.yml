services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polofeedback}
      POSTGRES_USER: ${POSTGRES_USER:-polo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polo} -d ${POSTGRES_DB:-polofeedback}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DATABASE_URL: postgres://${POSTGRES_USER:-polo}:${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-polofeedback}
      DASHBOARD_MANAGER_USERNAME: ${DASHBOARD_MANAGER_USERNAME:-gerente}
      DASHBOARD_MANAGER_PASSWORD: ${DASHBOARD_MANAGER_PASSWORD:?Defina DASHBOARD_MANAGER_PASSWORD no arquivo .env}
      DASHBOARD_OWNER_USERNAME: ${DASHBOARD_OWNER_USERNAME:-marcos}
      DASHBOARD_OWNER_PASSWORD: ${DASHBOARD_OWNER_PASSWORD:?Defina DASHBOARD_OWNER_PASSWORD no arquivo .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
