name: Testes da avaliação por modalidade

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar seleção e gravação das aulas coletivas
        run: >
          python manage.py test
          feedback.tests.FeedbackViewsTests.test_avaliacao_registra_aula_coletiva_especifica
          feedback.tests.FeedbackViewsTests.test_avaliacao_de_aula_coletiva_exige_modalidade_valida
