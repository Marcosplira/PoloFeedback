name: Testes de avaliação e alertas WhatsApp

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar avaliações, aulas coletivas e fila WhatsApp (sem envio real)
        run: >
          python manage.py test
          feedback.tests.FeedbackViewsTests.test_avaliacao_registra_aula_coletiva_especifica
          feedback.tests.FeedbackViewsTests.test_avaliacao_de_aula_coletiva_exige_modalidade_valida
          feedback.tests.FeedbackViewsTests.test_avaliacao_publica_enfileira_aviso_sem_enviar_na_requisicao
          feedback.tests.FeedbackViewsTests.test_formulario_informa_encaminhamento_ao_whatsapp_quando_ativo
          feedback.tests.FeedbackViewsTests.test_comando_envia_template_e_atualiza_outbox
          feedback.tests.FeedbackViewsTests.test_comando_desligado_preserva_fila_sem_enviar
          feedback.tests.FeedbackViewsTests.test_comando_nao_registra_comentario_quando_api_rejeita
